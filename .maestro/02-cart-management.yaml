appId: "host.exp.exponent"
---
# 1. Launch the app
- launchApp:
    clearState: true
- tapOn: "Close" # Dismiss Expo Developer menu popup

# 2. Add an item from the main screen
- assertVisible:
    id: ".*product-card-.*"
- tapOn:
    id: ".*add-to-cart-.*"

# 3. Open the Cart
- tapOn:
    id: "cart-badge"
- assertVisible: "Your Cart"

# 4. Increment the quantity
- tapOn:
    id: ".*cart-item-quantity-.*-increase"
- assertVisible: "2" # The quantity text should update to 2

# 5. Decrement the quantity back to 1
- tapOn:
    id: ".*cart-item-quantity-.*-decrease"
- assertVisible: "1"

# 6. Remove the item entirely from the cart
- tapOn: 
    id: ".*cart-item-remove-.*"

# 7. Verify the Empty Cart state
- assertVisible: "Your cart is empty"
- assertVisible: "Looks like you haven't added anything yet."

# 8. Use the empty state action to return home
- tapOn: "Start Shopping"

# 9. Verify we are back on the main listing screen
- assertVisible: 
    id: ".*product-card-.*"

