appId: "host.exp.exponent"
---
# 1. Launch the app
- launchApp:
    clearState: true
- tapOn: "shopping-app"

- tapOn: "Close" # Dismiss Expo Developer menu popup

# 2. Wait for the main product listing to load
- assertVisible: 
    id: ".*product-card-.*"

# 3. Add item to cart directly from the listing screen
- tapOn:
    id: ".*add-to-cart-.*" 

# 5. Navigate to the product details screen
- tapOn: 
    id: ".*product-card-.*"

# 6. Verify we are on the details screen
- assertVisible: 
    id: "product-view-add-to-cart"

# 7. Add item to cart from details screen
- tapOn:
    id: "product-view-add-to-cart"

# 8. Navigate back to the listing screen
- back

# 9. Verify the Cart badge shows 2 items
- assertVisible:
    id: "cart-badge"

# 10. Open the Cart screen
- tapOn:
    id: "cart-badge"

# 11. Verify Cart screen contents
- assertVisible: "Shopping Cart"
- assertVisible: "Subtotal" 
- assertVisible: "R*"
